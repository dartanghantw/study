name: Integration Pipeline
on:
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string
        description: 'Docker image tag to deploy'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}      
      # check if this commit doenst have a tag
      - name: Checking
        run: echo "Doing some CI tasks... ${{ inputs.commit_sha }}"
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run tests
        run: |
          echo "Running tests..."
          ls -lart
      - name: Install uv
        uses: astral-sh/setup-uv@v8.0
      - name: Databricks validation
        uses: actions/ai-inference@v1
        with:
          # model: openai/gpt-5-mini
          system-prompt-file: .github/agents/databricks-knowledge.agent.md
          prompt: "Scan the project's databricks content and validate"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}