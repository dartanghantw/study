# This is a Databricks asset bundle definition for my_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: my_project
  uuid: d69553c8-022c-4562-884b-eaa82d15450c

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

include:
  - resources/*.yml
  - resources/*/*.yml

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-4472116791396252.12.azuredatabricks.net

  prod:
    mode: production
    workspace:
      host: https://adb-4472116791396252.12.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/dartanghan@bouwen.com.br to make sure we only have a single copy.
      root_path: /Workspace/Users/dartanghan@bouwen.com.br/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: dartanghan@bouwen.com.br
        level: CAN_MANAGE
